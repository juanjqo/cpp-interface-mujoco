name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:dqrobotics-dev/development
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libeigen3-dev libglfw3-dev libgl1-mesa-dev \
            libgl1-mesa-dri libdqrobotics xvfb valgrind

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j $(nproc)

      # Most tests are headless. The window tests run on a virtual display with software OpenGL.
      - name: Test
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix "${{ runner.temp }}/install"
