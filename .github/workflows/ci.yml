name: CI

# Builds the library, the examples and the tests, runs the tests, and checks the installation.
# MuJoCo is built from source (FetchContent), and ccache keeps it between runs. sas_cpp is the
# installed libmarinholab-sas-core, from the SmartArmStack apt repository, as users install it.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # libmarinholab-sas-core (sas_cpp) comes from the SmartArmStack apt repository. The fingerprint
      # of its key is checked, so a replaced key fails the run.
      - name: Add the SmartArmStack apt repository
        run: |
          curl -fsSL https://smartarmstack.github.io/smart_arm_stack_ROS2/KEY.gpg \
            | gpg --dearmor > "${{ runner.temp }}/smartarmstack.gpg"
          gpg --show-keys --with-colons "${{ runner.temp }}/smartarmstack.gpg" \
            | grep -q '^fpr:::::::::C44FEDE1355A5DBAF5758466E1608D5BE04DABBD:$'
          sudo install -D -m 644 "${{ runner.temp }}/smartarmstack.gpg" /etc/apt/keyrings/smartarmstack.gpg
          echo "deb [signed-by=/etc/apt/keyrings/smartarmstack.gpg] https://smartarmstack.github.io/smart_arm_stack_ROS2 ./" \
            | sudo tee /etc/apt/sources.list.d/smartarmstack.list

      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:dqrobotics-dev/development
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libeigen3-dev libglfw3-dev libgl1-mesa-dev \
            libgl1-mesa-dri libegl-dev libegl-mesa0 libdqrobotics libmarinholab-sas-core \
            xvfb valgrind ninja-build ccache

      - name: Cache the compilation (ccache)
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ runner.os }}-${{ hashFiles('dependencies.cmake') }}
          max-size: 2G

      # The installed sas_cpp is required: the run fails instead of building it from source
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_REQUIRE_FIND_PACKAGE_marinholab_sas_core=ON

      - name: Build
        run: cmake --build build

      # Most tests are headless (the headless camera tests render with EGL, Mesa's software device).
      # The window tests run on a virtual display with software OpenGL.
      - name: Test
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ctest --test-dir build --output-on-failure

      - name: Install
        run: |
          cmake --install build --prefix "${{ runner.temp }}/install"
          test -f "${{ runner.temp }}/install/lib/cmake/dqrobotics-interface-mujoco/dqrobotics-interface-mujocoConfig.cmake"
          test -f "${{ runner.temp }}/install/lib/cmake/dqrobotics-interface-mujoco/DQMujocoEmbedModel.cmake"
          test -f "${{ runner.temp }}/install/share/doc/dqrobotics-interface-mujoco/LICENSE"
          test -f "${{ runner.temp }}/install/share/doc/dqrobotics-interface-mujoco/third_party/mujoco/LICENSE"
          test -f "${{ runner.temp }}/install/share/doc/dqrobotics-interface-mujoco/third_party/imgui/LICENSE.txt"
          test -f "${{ runner.temp }}/install/share/doc/dqrobotics-interface-mujoco/third_party/imguizmo/LICENSE"
          test -f "${{ runner.temp }}/install/share/doc/dqrobotics-interface-mujoco/third_party/imoguizmo/LICENSE"
          test -f "${{ runner.temp }}/install/share/doc/dqrobotics-interface-mujoco/third_party/roboto/NOTICE"
          # Dear ImGui and the gizmos are built into the library: no headers installed, no symbols exported
          test ! -e "${{ runner.temp }}/install/include/imgui.h"
          if nm -D --defined-only "${{ runner.temp }}"/install/lib/libdqrobotics-interface-mujoco.so | c++filt | grep -q "ImGui::\|ImGuizmo::"; then
            echo "libdqrobotics-interface-mujoco.so exports ImGui or ImGuizmo symbols"; exit 1
          fi
